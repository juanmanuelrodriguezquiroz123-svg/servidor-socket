<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pantalla Receptora</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0b192c; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; transition: background-color 0.5s; }
    .foco { width: 140px; height: 140px; border-radius: 50%; background-color: #333; margin-bottom: 30px; transition: 0.3s; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
    .encendido { background-color: #ffeb3b; box-shadow: 0 0 70px #ffeb3b; }
    .status-title { font-size: 1.8rem; font-weight: bold; margin-bottom: 10px; color: #888; }
    .card { background: #1e1e1e; padding: 25px; border-radius: 20px; width: 100%; max-width: 350px; text-align: center; }
  </style>
</head>
<body>

  <div id="foco" class="foco"></div>

  <div class="card">
    <div id="textoEstado" class="status-title">DESCONECTADO</div>
    <p style="color: #64b5f6; font-size: 0.9rem;">¡Sistema actualizado en tiempo real!</p>
    
  </div>

  <script>
    const socket = io("https://servidor-socket-htsu.onrender.com");
    const SALA_ID = "SALA-1";

    socket.emit('unirse_sala', SALA_ID);

    // Cambia el estado visual al mover el interruptor
    socket.on('estado_actualizado', (encendido) => {
      const foco = document.getElementById('foco');
      const texto = document.getElementById('textoEstado');

      if (encendido) {
        foco.classList.add('encendido');
        texto.innerText = "¡ENCENDIDO!";
        texto.style.color = "#ffeb3b";
      } else {
        foco.classList.remove('encendido');
        texto.innerText = "APAGADO";
        texto.style.color = "#888";
      }
    });
  </script>
</body>
</html>
