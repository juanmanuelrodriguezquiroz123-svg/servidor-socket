<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Control Remoto</title>

  <!-- Configuración PWA para apariencia de App Nativa -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#121212">

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    h1 { font-size: 1.4rem; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px; color: #888; }
    .card { background: #1e1e1e; padding: 30px; border-radius: 20px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 30px; }
    .status { font-size: 1.2rem; margin-bottom: 20px; font-weight: bold; }
    .switch { position: relative; display: inline-block; width: 70px; height: 38px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 38px; }
    .slider:before { position: absolute; content: ""; height: 30px; width: 30px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #4caf50; }
    input:checked + .slider:before { transform: translateX(32px); }
    .btn-danger { background-color: #ff5252; color: white; border: none; padding: 18px 25px; font-size: 1rem; font-weight: bold; border-radius: 12px; width: 100%; max-width: 350px; box-shadow: 0 5px 15px rgba(255,82,82,0.3); }
    .btn-danger:active { transform: scale(0.98); background-color: #e04848; }
  </style>
</head>
<body>

  <h1>Controlador Móvil</h1>

  <div class="card">
    <div id="statusText" class="status" style="color: #888;">APAGADO</div>
    <label class="switch">
      <input type="checkbox" id="toggleState" onchange="cambiarEstado(this.checked)">
      <span class="slider"></span>
    </label>
  </div>

  <button class="btn-danger" onclick="apagarReceptor()">APAGAR TELÉFONO RECEPTOR</button>

  <script>
    const socket = io("https://servidor-socket-htsu.onrender.com");
    const SALA_ID = "SALA-1";

    socket.emit('unirse_sala', SALA_ID);

    function cambiarEstado(encendido) {
      document.getElementById('statusText').innerText = encendido ? "ENCENDIDO" : "APAGADO";
      document.getElementById('statusText').style.color = encendido ? "#4caf50" : "#888";
      socket.emit('cambiar_interruptor', { salaId: SALA_ID, estado: encendido });
    }

    function apagarReceptor() {
  socket.emit('solicitar_apagado_telefono', { salaId: SALA_ID });
  console.log("Comando enviado al teléfono objetivo.");
    }
  
  </script>
</body>
</html>
